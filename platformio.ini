; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; The platform is pinned. It used to read "espressif32" with no version, so
; two people building the same commit could get different firmware, and a
; toolchain bump could change timing behaviour on a device already in a wall.
;
; Note for the ESP32-C5: the official espressif32 platform does not support it.
; That target needs the community pioarduino fork on Arduino core 3.x / IDF
; 5.4+, which is why the platform is set per environment group rather than
; once at the top - the C3 can stay on a known good version while a newer
; chip tracks something else.

[common]
platform = espressif32@6.9.0
framework = arduino
lib_deps =
	adafruit/Adafruit SSD1306@^2.5.13
	SPIFFSIniFile=https://github.com/yurilopes/SPIFFSIniFile.git#61bf6473b0076a5d1eb5fbd1b6a341140796bd80
	NimBLE=https://github.com/h2zero/NimBLE-Arduino.git#62180ab2bc9c9a8b41f9fb800ea7256e89628a3a
	libosdp=https://github.com/goToMain/libosdp#88a7788e2485a1df9312b6c373556c1e9269f1f6
monitor_speed = 115200
debug_tool = esp-builtin
debug_init_break = tbreak setup
extra_scripts = platformio_utils.py
build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-Wall
	-Wextra
	-Wno-unused-parameter
	-Wno-missing-field-initializers

; --- feature sets -----------------------------------------------------------
; Kept separate from the board so that every feature set can be built for
; every board, and so CI can prove the combinations still compile.

[features_full]
build_flags =
	-D USE_WIFI=1
	-D USE_HTTP=1
	-D USE_LCD=1
	-D USE_WIEGAND=1
	-D USE_CLOCKANDDATA=1
	-D USE_MDNS_RESPONDER=1
	-D USE_BLE=1
	-D USE_OSDP=1

; Smallest useful build: capture and replay over WiFi, nothing else. Exists
; mostly so that the module boundaries stay honest - it is the combination
; that used to fail to link.
[features_minimal]
build_flags =
	-D USE_WIFI=1
	-D USE_HTTP=1
	-D USE_WIEGAND=1

; --- boards -----------------------------------------------------------------

[board_c3_supermini]
board = tenstar_esp32c3_supermini_plus
board_build.variants_dir = variants/rev02
build_flags = -D TICK_BOARD_C3_SUPERMINI_REV02=1

[board_s3_devkitc1]
board = esp32-s3-devkitc-1
build_flags = -D TICK_BOARD_S3_DEVKITC1=1

; --- environments -----------------------------------------------------------

[env:ble]
extends = common
board = ${board_c3_supermini.board}
board_build.variants_dir = ${board_c3_supermini.board_build.variants_dir}
board_build.partitions = huge_app.csv
build_flags =
	${common.build_flags}
	${features_full.build_flags}
	${board_c3_supermini.build_flags}

[env:ota]
extends = common
board = ${board_c3_supermini.board}
board_build.variants_dir = ${board_c3_supermini.board_build.variants_dir}
board_build.partitions = default.csv
build_flags =
	${common.build_flags}
	${features_full.build_flags}
	${board_c3_supermini.build_flags}
	-D USE_OTA_HTTP=1

; ESP32-S3. Dual core Xtensa rather than single core RISC-V, which is what
; makes it the interesting port: code that shares state between an interrupt
; and the main loop without protection has been getting away with it on the
; C3 because only one thing runs at a time.
[env:s3]
extends = common
board = ${board_s3_devkitc1.board}
board_build.partitions = huge_app.csv
build_flags =
	${common.build_flags}
	${features_full.build_flags}
	${board_s3_devkitc1.build_flags}
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1

; Build-only target proving the module boundaries hold with most features off.
[env:minimal]
extends = common
board = ${board_c3_supermini.board}
board_build.variants_dir = ${board_c3_supermini.board_build.variants_dir}
board_build.partitions = default.csv
build_flags =
	${common.build_flags}
	${features_minimal.build_flags}
	${board_c3_supermini.build_flags}

; Host-side unit tests for the pure logic - bit packing, hex rendering,
; transmit validation. Runs on a laptop, no hardware needed.
[env:native]
platform = native
test_framework = unity
build_flags =
	-std=gnu++17
	-Wall
	-Wextra
	-D TICK_NATIVE_TEST=1
	-I test/native/stubs
build_src_filter = -<*>

; The same tests under sanitizers. AddressSanitizer catches out-of-bounds and
; use-after-free; UndefinedBehaviorSanitizer catches bad shifts, overflow and
; misaligned access; ThreadSanitizer checks that the interrupt/main-loop
; locking discipline actually holds - which is the thing the S3's second core
; will punish if it does not.
[env:native_asan]
extends = env:native
build_flags =
	${env:native.build_flags}
	-fsanitize=address,undefined
	-fno-omit-frame-pointer
	-g

[env:native_tsan]
extends = env:native
build_flags =
	${env:native.build_flags}
	-fsanitize=thread
	-fno-omit-frame-pointer
	-g
