name: build

# Two forks work on this firmware in parallel and there is no hardware in CI,
# so the compiler and the host tests are the safety net. Every supported flag
# combination is built, not just the ones that ship.

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [ble, ota, minimal, s3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - run: pio run -e ${{ matrix.environment }}

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio
      - name: HTTP authentication audit
        run: python3 tools/audit_http_auth.py
      - name: Unit tests
        run: pio test -e native
      - name: AddressSanitizer and UndefinedBehaviorSanitizer
        run: pio test -e native_asan
      - name: ThreadSanitizer
        # Each suite is built and run explicitly. ThreadSanitizer cannot cope
        # with the ASLR layout on some kernels, so the binary is built through
        # PlatformIO and then run directly with randomisation disabled - but
        # the build failure is not swallowed, and every suite is named rather
        # than relying on whichever binary happened to be built last.
        run: |
          set -euo pipefail
          for suite in test_capture test_board test_aes test_findings test_osdp_dissect test_osdp_monitor; do
            echo "::group::ThreadSanitizer $suite"
            pio test -e native_tsan -f "$suite" --without-testing
            setarch -R ./.pio/build/native_tsan/program
            echo "::endgroup::"
          done
